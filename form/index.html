
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    form {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: 0 auto;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .response-message {
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Contact Us</h1>

  <form id="contactForm" action="https://formspree.io/f/meqbqwbv" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">Submit</button>
  </form>

  <div id="formResponse" class="response-message"></div>

  <script>
    // JavaScript to handle form submission
    document.getElementById('contactForm').addEventListener('submit', function(event) {
      event.preventDefault(); // Prevents the default form submission
      
      const form = this;
      const formResponse = document.getElementById('formResponse');
      
      // Show a loading message
      formResponse.textContent = "Submitting...";
      
      // Create FormData from the form
      const formData = new FormData(form);

      // Use Fetch API to submit the form
      fetch(form.action, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        form.reset(); // Reset the form
        formResponse.textContent = "Thank you for your message!"; // Success message
      })
      .catch(error => {
        formResponse.textContent = "There was an error. Please try again."; // Error message
      });
    });
  </script>

</body>
</html>
